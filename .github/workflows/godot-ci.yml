name: Godot CI/CD Pipeline

on: [push, pull_request]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GODOT_VERSION: "4.7.2"
  GODOT_STATUS: "stable"

jobs:
  import-assets:
    runs-on: ubuntu-latest
    container: barichello/godot-ci:4.7.2

    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot imported assets
        id: godot-import-cache
        uses: actions/cache@v4
        with:
          path: |
            godot/.godot/imported
            godot/.godot/uid_cache.bin
          key: >-
            godot-import-${{ runner.os }}-${{ env.GODOT_VERSION }}-${{
              hashFiles(
                'godot/project.godot',
                'godot/export_presets.cfg',
                'godot/**/*.import',
                'godot/**/*.png',
                'godot/**/*.jpg',
                'godot/**/*.jpeg',
                'godot/**/*.webp',
                'godot/**/*.svg',
                'godot/**/*.ogg',
                'godot/**/*.wav',
                'godot/**/*.mp3',
                'godot/**/*.ttf',
                'godot/**/*.otf',
                'godot/**/*.glb',
                'godot/**/*.gltf',
                'godot/**/*.fbx',
                'godot/**/*.blend'
              )
            }}
          restore-keys: |
            godot-import-${{ runner.os }}-${{ env.GODOT_VERSION }}-
            godot-import-${{ runner.os }}-

      - name: Import assets
        if: steps.godot-import-cache.outputs.cache-hit != 'true'
        working-directory: godot
        run: godot --headless --verbose --editor --quit

  export-game:
    runs-on: ubuntu-latest
    needs: import-assets

    steps:
      - uses: actions/checkout@v4

      - name: Restore Godot imported assets
        uses: actions/cache@v4
        with:
          path: |
            godot/.godot/imported
            godot/.godot/uid_cache.bin
          key: >-
            godot-import-${{ runner.os }}-${{ env.GODOT_VERSION }}-${{
              hashFiles(
                'godot/project.godot',
                'godot/export_presets.cfg',
                'godot/**/*.import',
                'godot/**/*.png',
                'godot/**/*.jpg',
                'godot/**/*.jpeg',
                'godot/**/*.webp',
                'godot/**/*.svg',
                'godot/**/*.ogg',
                'godot/**/*.wav',
                'godot/**/*.mp3',
                'godot/**/*.ttf',
                'godot/**/*.otf',
                'godot/**/*.glb',
                'godot/**/*.gltf',
                'godot/**/*.fbx',
                'godot/**/*.blend'
              )
            }}
          restore-keys: |
            godot-import-${{ runner.os }}-${{ env.GODOT_VERSION }}-
            godot-import-${{ runner.os }}-

      - name: Install Wine
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends wine64
          echo "WINE_PATH=$(which wine64)" >> "$GITHUB_ENV"

      - name: Export Game using Godot
        uses: firebelley/godot-export@v8.0.0
        with:
          godot_executable_download_url: "https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}-${{ env.GODOT_STATUS }}/Godot_v${{ env.GODOT_VERSION }}-${{ env.GODOT_STATUS }}_linux.x86_64.zip"
          godot_export_templates_download_url: "https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}-${{ env.GODOT_STATUS }}/Godot_v${{ env.GODOT_VERSION }}-${{ env.GODOT_STATUS }}_export_templates.tpz"
          relative_project_path: "./godot"
          archive_output: true
          cache: true
          wine_path: ${{ env.WINE_PATH }}

      - name: Collect archives
        run: |
          mkdir -p dist
          cp /home/runner/.local/share/godot/archives/*.zip dist/
          ls -lah dist

      - name: Upload builds
        uses: actions/upload-artifact@v4
        with:
          name: builds
          path: dist/*.zip
          if-no-files-found: error
          compression-level: 0

  deploy-to-itchio:
    runs-on: ubuntu-latest
    needs: export-game
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - name: Linux
            channel: linux
            package: LinuxX11.zip
          - name: Windows
            channel: windows
            package: Windows.zip
          - name: macOS
            channel: mac
            package: macOS.zip
          - name: HTML5
            channel: web
            package: HTML5.zip

    steps:
      - name: Download builds
        uses: actions/download-artifact@v4
        with:
          name: builds
          path: dist

      - name: Deploy to Itch.io (${{ matrix.name }})
        uses: manleydev/butler-publish-itchio-action@master
        env:
          BUTLER_CREDENTIALS: ${{ secrets.BUTLER_API_KEY }}
          CHANNEL: ${{ matrix.channel }}
          ITCH_GAME: ${{ secrets.ITCHIO_GAME }}
          ITCH_USER: ${{ secrets.ITCHIO_USERNAME }}
          PACKAGE: dist/${{ matrix.package }}
